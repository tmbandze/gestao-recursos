<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Recursos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #f4f2eb;
  --paper:    #fffffe;
  --surface:  #ede9df;
  --border:   #d4d0c7;
  --border-d: #bbb7ae;

  --ink:      #191714;
  --ink-m:    #6b6760;
  --ink-d:    #b4b0a9;

  --green:    #1c4a28;
  --green-mid:#2a6b3c;
  --green-bg: #e9f2eb;
  --green-br: #b4d1bc;

  --orange:   #b84d0c;
  --orange-bg:#fdeee6;
  --orange-br:#f0b99a;

  --navy:     #1a3f72;
  --navy-bg:  #e8eef7;
  --navy-br:  #b0c3de;

  --red:      #9e2020;
  --red-bg:   #faeaea;

  --fd: 'Fraunces', Georgia, serif;
  --fb: 'Plus Jakarta Sans', sans-serif;
  --fm: 'JetBrains Mono', monospace;

  --r:  8px;
  --rs: 5px;
  --shadow: 0 2px 12px rgba(25,23,20,.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: var(--fb);
  background: var(--bg);
  color: var(--ink);
  min-height: 100%;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ─── AUTH ──────────────────────────────────────────────────────── */
#auth-view {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem 1rem;
  position: relative;
  overflow: hidden;
}

/* Dot-grid pattern */
#auth-view::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, var(--border-d) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
  opacity: .55;
}

/* Large background word */
#auth-view::after {
  content: 'BIBLIOTECA';
  position: fixed;
  bottom: -1rem;
  right: -2rem;
  font-family: var(--fd);
  font-size: clamp(5rem, 15vw, 11rem);
  font-weight: 700;
  color: var(--border);
  letter-spacing: -.04em;
  line-height: 1;
  pointer-events: none;
  user-select: none;
  opacity: .55;
}

.auth-card {
  background: var(--paper);
  border: 1.5px solid var(--border-d);
  border-radius: var(--r);
  padding: 2.5rem 2.25rem;
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 1;
  box-shadow: 0 4px 24px rgba(25,23,20,.1);
  animation: cardUp .45s cubic-bezier(.22,.68,0,1.15) both;
}

/* Green top accent stripe */
.auth-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--green);
  border-radius: var(--r) var(--r) 0 0;
}

@keyframes cardUp {
  from { opacity: 0; transform: translateY(16px) scale(.98); }
  to   { opacity: 1; transform: none; }
}

.auth-brand {
  display: flex;
  align-items: center;
  gap: .6rem;
  margin-bottom: .3rem;
}

.brand-icon { font-size: 1.4rem; line-height: 1; }

.brand-name {
  font-family: var(--fd);
  font-size: 1.35rem;
  font-weight: 600;
  letter-spacing: -.015em;
  color: var(--ink);
}

.brand-name b { color: var(--green); font-weight: 600; }

.auth-sub {
  color: var(--ink-m);
  font-size: .825rem;
  margin-bottom: 1.75rem;
  padding-left: 2rem;
}

/* Underline tabs */
.auth-tabs {
  display: flex;
  border-bottom: 1.5px solid var(--border);
  margin-bottom: 1.5rem;
}

.atab {
  background: none; border: none;
  font-family: var(--fb);
  font-size: .875rem; font-weight: 500;
  color: var(--ink-m);
  padding: .45rem 1.1rem .55rem;
  cursor: pointer;
  position: relative;
  transition: color .15s;
}

.atab::after {
  content: '';
  position: absolute;
  bottom: -1.5px; left: 0; right: 0;
  height: 2px;
  background: var(--green);
  transform: scaleX(0);
  transition: transform .2s cubic-bezier(.4,0,.2,1);
  transform-origin: left;
}

.atab.active { color: var(--ink); font-weight: 600; }
.atab.active::after { transform: scaleX(1); }

.aform { display: none; }
.aform.active { display: block; animation: fadeIn .18s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ─── FORM FIELDS ────────────────────────────────────────────────── */
.field { margin-bottom: .9rem; }

.field label {
  display: block;
  font-size: .72rem; font-weight: 600;
  letter-spacing: .065em;
  text-transform: uppercase;
  color: var(--ink-m);
  margin-bottom: .3rem;
}

.field input {
  width: 100%;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--rs);
  color: var(--ink);
  font-family: var(--fb);
  font-size: .9rem;
  padding: .6rem .875rem;
  outline: none;
  transition: border-color .15s, background .15s;
}

.field input:focus { border-color: var(--green); background: var(--paper); }
.field input::placeholder { color: var(--ink-d); }

/* ─── BUTTONS ────────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center; justify-content: center;
  gap: .35rem;
  border: 1.5px solid transparent;
  border-radius: var(--rs);
  font-family: var(--fb);
  font-size: .875rem; font-weight: 600;
  padding: .58rem 1.1rem;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  line-height: 1;
}

.btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
.btn-primary:hover { background: var(--green-mid); border-color: var(--green-mid); }

.btn-ghost { background: transparent; color: var(--ink-m); border-color: var(--border); }
.btn-ghost:hover { color: var(--ink); border-color: var(--border-d); background: var(--surface); }

.btn-success { background: var(--green); color: #fff; border-color: var(--green); }
.btn-success:hover { background: var(--green-mid); }

.btn-danger { background: var(--orange); color: #fff; border-color: var(--orange); }
.btn-danger:hover { background: #9a3f08; }

.btn-outline-orange {
  background: var(--orange-bg); color: var(--orange);
  border-color: var(--orange-br);
}

.btn-full { width: 100%; margin-top: .75rem; }
.btn-sm   { padding: .35rem .7rem; font-size: .8rem; font-weight: 500; }

/* ─── MAIN VIEW ──────────────────────────────────────────────────── */
#main-view { display: none; min-height: 100vh; flex-direction: column; }
#main-view.active { display: flex; }

header {
  background: var(--paper);
  border-bottom: 1.5px solid var(--border);
  padding: .875rem 1.75rem;
  display: flex; align-items: center; gap: 1rem;
  flex-wrap: wrap;
  position: sticky; top: 0; z-index: 50;
}

.logo { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
.logo-mark { font-size: 1.2rem; }
.logo-name {
  font-family: var(--fd);
  font-size: 1.1rem; font-weight: 600;
  letter-spacing: -.015em;
}
.logo-name em { font-style: normal; color: var(--green); }

.search-wrap {
  flex: 1; min-width: 160px; max-width: 460px;
  position: relative;
}

.search-wrap input {
  width: 100%;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--rs);
  color: var(--ink);
  font-family: var(--fb); font-size: .875rem;
  padding: .5rem .875rem .5rem 2.2rem;
  outline: none;
  transition: border-color .15s, background .15s;
}

.search-wrap input:focus { border-color: var(--green); background: var(--paper); }
.search-wrap input::placeholder { color: var(--ink-d); }

.search-icon {
  position: absolute; left: .65rem; top: 50%;
  transform: translateY(-50%);
  color: var(--ink-d); pointer-events: none;
}

.header-end {
  margin-left: auto;
  display: flex; align-items: center; gap: .6rem;
  flex-shrink: 0;
}

.user-chip {
  display: flex; align-items: center; gap: .45rem;
  background: var(--green-bg);
  border: 1.5px solid var(--green-br);
  border-radius: 4px;
  padding: .28rem .75rem .28rem .4rem;
  font-size: .825rem; font-weight: 600;
  color: var(--green);
}

.user-av {
  width: 22px; height: 22px;
  background: var(--green);
  color: #fff; border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: .62rem; font-weight: 700;
  font-family: var(--fb);
  text-transform: uppercase; letter-spacing: .02em;
}

/* ─── MAIN CONTENT ───────────────────────────────────────────────── */
main {
  flex: 1;
  padding: 1.75rem;
  max-width: 1440px;
  width: 100%; margin: 0 auto;
}

/* Stats */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
  margin-bottom: 1.75rem;
}

.stat {
  background: var(--paper);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 1.25rem 1.5rem;
  position: relative; overflow: hidden;
}

.stat::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: var(--r) var(--r) 0 0;
}

.stat.navy::before  { background: var(--navy); }
.stat.green::before { background: var(--green); }
.stat.orange::before{ background: var(--orange); }

.stat-n {
  font-family: var(--fd);
  font-size: 2.5rem; font-weight: 600;
  line-height: 1; margin-bottom: .2rem;
}

.stat.navy .stat-n  { color: var(--navy); }
.stat.green .stat-n { color: var(--green); }
.stat.orange .stat-n{ color: var(--orange); }

.stat-l {
  font-size: .7rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: .09em;
  color: var(--ink-m);
}

/* Toolbar */
.toolbar {
  display: flex; align-items: center; gap: .75rem;
  margin-bottom: 1.25rem; flex-wrap: wrap;
}

.seg {
  display: flex;
  border: 1.5px solid var(--border-d);
  border-radius: var(--rs);
  overflow: hidden;
  background: var(--paper);
}

.seg-btn {
  background: transparent; border: none;
  border-right: 1.5px solid var(--border-d);
  color: var(--ink-m);
  padding: .42rem .95rem;
  font-family: var(--fb); font-size: .825rem; font-weight: 500;
  cursor: pointer;
  transition: background .12s, color .12s;
}

.seg-btn:last-child { border-right: none; }
.seg-btn.active { background: var(--green); color: #fff; font-weight: 600; }
.seg-btn:hover:not(.active) { background: var(--bg); color: var(--ink); }

.sp { flex: 1; }

/* Books grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
  gap: 1rem;
}

.book {
  background: var(--paper);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 1.1rem 1.25rem 1.1rem 1.5rem;
  cursor: pointer;
  position: relative; overflow: hidden;
  transition: border-color .18s, box-shadow .18s;
  animation: bookIn .3s ease both;
}

@keyframes bookIn {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: none; }
}

/* Book spine */
.book::before {
  content: '';
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 4px;
}

.book.av::before  { background: var(--green); }
.book.req::before { background: var(--orange); }

.book:hover { border-color: var(--border-d); box-shadow: var(--shadow); }
.book.av:hover  { border-color: var(--green-br); }
.book.req:hover { border-color: var(--orange-br); }

.book-t {
  font-family: var(--fd);
  font-size: .975rem; font-weight: 600;
  line-height: 1.3; margin-bottom: .18rem;
}

.book-a {
  font-size: .8rem; font-style: italic;
  color: var(--ink-m);
  margin-bottom: .875rem;
}

.book-f { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }

/* Badges */
.badge {
  display: inline-block;
  font-family: var(--fm);
  font-size: .66rem; font-weight: 500;
  padding: .17rem .5rem;
  border-radius: 3px;
  border: 1.5px solid transparent;
}

.b-green  { background: var(--green-bg);  color: var(--green);  border-color: var(--green-br); }
.b-orange { background: var(--orange-bg); color: var(--orange); border-color: var(--orange-br); }
.b-navy   { background: var(--navy-bg);   color: var(--navy);   border-color: var(--navy-br); }
.b-muted  { background: var(--surface);   color: var(--ink-m);  border-color: var(--border); }

/* Empty / Loading */
.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 5rem 2rem;
  color: var(--ink-m);
}

.empty-icon { font-size: 2.5rem; margin-bottom: .75rem; opacity: .45; }
.empty p { font-size: .9rem; }

.spinner {
  width: 26px; height: 26px;
  border: 2px solid var(--border-d);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 1rem;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ─── MODALS ─────────────────────────────────────────────────────── */
.ov {
  display: none;
  position: fixed; inset: 0;
  background: rgba(25,23,20,.45);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 100;
  align-items: flex-end; justify-content: center;
  padding: 1rem;
}

.ov.open { display: flex; }

@media (min-width: 560px) { .ov { align-items: center; } }

.modal {
  background: var(--paper);
  border: 1.5px solid var(--border-d);
  border-radius: var(--r);
  padding: 1.75rem;
  width: 100%; max-width: 500px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 8px 32px rgba(25,23,20,.15);
  animation: mUp .22s cubic-bezier(.22,.68,0,1.1) both;
}

@keyframes mUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}

.mhead {
  display: flex; align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 1.5rem; gap: 1rem;
}

.mhead h2 {
  font-family: var(--fd);
  font-size: 1.2rem; font-weight: 600;
  letter-spacing: -.01em; line-height: 1.3;
}

.mclose {
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--ink-m);
  width: 26px; height: 26px;
  border-radius: 50%;
  font-size: .75rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all .15s;
}

.mclose:hover { color: var(--ink); border-color: var(--border-d); }

.drow {
  display: flex; gap: 1rem;
  margin-bottom: .6rem; align-items: flex-start;
}

.dlabel {
  font-size: .68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-d);
  width: 88px; flex-shrink: 0;
  padding-top: .15rem;
}

.dval { font-size: .875rem; }

.queue-list { display: flex; flex-direction: column; gap: .25rem; }
.queue-item {
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--rs);
  padding: .3rem .7rem;
  font-family: var(--fm); font-size: .78rem;
  color: var(--ink-m);
}

.mactions { display: flex; gap: .6rem; margin-top: 1.5rem; flex-wrap: wrap; }
.factions  { display: flex; gap: .6rem; justify-content: flex-end; margin-top: 1.5rem; }

.mdivider { height: 1.5px; background: var(--border); margin: 1.25rem 0; }

/* ─── TOASTS ─────────────────────────────────────────────────────── */
#toasts {
  position: fixed; bottom: 1.5rem; right: 1.5rem;
  display: flex; flex-direction: column; gap: .5rem;
  z-index: 300; pointer-events: none;
}

.toast {
  background: var(--paper);
  border: 1.5px solid var(--border-d);
  border-radius: var(--r);
  padding: .7rem 1rem;
  max-width: 300px; font-size: .85rem;
  box-shadow: 0 4px 16px rgba(25,23,20,.12);
  animation: tIn .2s ease both;
  pointer-events: all;
  display: flex; gap: .6rem; align-items: center;
}

.toast::before {
  content: ''; width: 3px;
  align-self: stretch; border-radius: 2px; flex-shrink: 0;
}

.toast.ok::before  { background: var(--green); }
.toast.err::before { background: var(--red); }
.toast.inf::before { background: var(--navy); }

@keyframes tIn {
  from { opacity: 0; transform: translateX(10px); }
  to   { opacity: 1; transform: none; }
}

/* ─── ADMIN ──────────────────────────────────────────────────────── */
.admin-box {
  background: var(--paper);
  border: 1.5px solid var(--border);
  border-top: 3px solid var(--orange);
  border-radius: var(--r);
  padding: 1.5rem;
  margin-top: 2rem;
}

.admin-title {
  font-size: .7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--orange); margin-bottom: 1rem;
}

.log-box {
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--rs);
  padding: 1rem;
  font-family: var(--fm); font-size: .72rem;
  color: var(--ink-m); max-height: 280px;
  overflow-y: auto; white-space: pre; line-height: 1.75;
}

/* ─── FORM SELECT / FILE ─────────────────────────────────────────── */
.field-select {
  width: 100%;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--rs);
  color: var(--ink);
  font-family: var(--fb);
  font-size: .9rem;
  padding: .6rem .875rem;
  outline: none;
  cursor: pointer;
  appearance: auto;
  transition: border-color .15s;
}
.field-select:focus { border-color: var(--green); }

.field input[type="file"] {
  padding: .48rem .875rem;
  cursor: pointer;
}
.file-hint {
  font-size: .7rem;
  color: var(--ink-d);
  margin-top: .25rem;
}
.field-opt {
  font-size: .65rem;
  color: var(--ink-d);
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0;
}

/* ─── PDF BADGE & LOCKED ─────────────────────────────────────────── */
.b-pdf { background: var(--navy-bg); color: var(--navy); border-color: var(--navy-br); }
.b-red { background: var(--red-bg);  color: var(--red);  border-color: #e9b0b0; }

/* ─── PRAZO (deadline) ───────────────────────────────────────────── */
.book-prazo { margin: .3rem 0 .55rem; }

/* ─── HISTÓRICO PESSOAL ──────────────────────────────────────────── */
.hist-sec-title {
  font-size: .68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .09em;
  color: var(--ink-d); margin-bottom: .6rem;
}

.hist-row {
  padding: .7rem 0;
  border-bottom: 1.5px solid var(--border);
}
.hist-row:last-child { border-bottom: none; }

.hist-titulo {
  font-family: var(--fd);
  font-size: .95rem; font-weight: 600;
  margin-bottom: .3rem;
}

.hist-meta { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }

.hist-empty {
  font-size: .85rem; color: var(--ink-d); padding: .5rem 0;
}

.pdf-locked {
  font-size: .78rem;
  color: var(--ink-m);
  padding: .45rem .8rem;
  background: var(--bg);
  border: 1.5px dashed var(--border-d);
  border-radius: var(--rs);
  display: inline-block;
}

/* ─── PDF VIEWER ─────────────────────────────────────────────────── */
.ov-pdf {
  display: none;
  position: fixed; inset: 0;
  background: rgba(25,23,20,.6);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  align-items: stretch;
  justify-content: center;
}
.ov-pdf.open { display: flex; }

.pdf-shell {
  background: var(--paper);
  border-left:  1.5px solid var(--border);
  border-right: 1.5px solid var(--border);
  width: 100%; max-width: 880px;
  display: flex; flex-direction: column;
}

.pdf-hd {
  background: var(--paper);
  border-bottom: 1.5px solid var(--border);
  padding: .875rem 1.5rem;
  display: flex; align-items: center; gap: 1rem;
  flex-shrink: 0;
}

.pdf-hd-title {
  font-family: var(--fd);
  font-size: 1.05rem; font-weight: 600;
  flex: 1; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis;
}

.pdf-nav-bar {
  background: var(--bg);
  border-bottom: 1.5px solid var(--border);
  padding: .5rem 1.25rem;
  display: flex; align-items: center; gap: .75rem;
  flex-shrink: 0;
}

.pdf-pg-info {
  font-family: var(--fm);
  font-size: .78rem;
  color: var(--ink-m);
  flex: 1; text-align: center;
}

.pdf-body {
  flex: 1;
  overflow: auto;
  background: #5a5854;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 2rem;
}

#pdf-canvas {
  box-shadow: 0 6px 28px rgba(0,0,0,.45);
  display: block;
  max-width: 100%;
}

.pdf-load-msg {
  color: #e8e5de;
  font-size: .875rem;
  display: flex; align-items: center; gap: .75rem;
  align-self: center; width: 100%;
  justify-content: center;
}

.pdf-load-msg .spinner {
  border-color: rgba(255,255,255,.2);
  border-top-color: #fff;
}

/* ─── RESPONSIVE ─────────────────────────────────────────────────── */
@media (max-width: 600px) {
  main { padding: 1rem; }
  .stats { gap: .5rem; }
  .stat { padding: 1rem; }
  .stat-n { font-size: 2rem; }
  header { padding: .75rem 1rem; }
}
</style>
</head>
<body>

<!-- ══ AUTH ═════════════════════════════════════════════════════════ -->
<div id="auth-view">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-icon">📚</span>
      <span class="brand-name">Gestão de <b>Recursos</b></span>
    </div>
    <p class="auth-sub">Biblioteca partilhada de estudantes</p>

    <div class="auth-tabs">
      <button class="atab active" id="atab-si" onclick="switchTab('si')">Entrar</button>
      <button class="atab"        id="atab-su" onclick="switchTab('su')">Criar conta</button>
    </div>

    <div class="aform active" id="aform-si">
      <div class="field">
        <label>Email</label>
        <input type="email" id="si-email" placeholder="o.teu@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="si-pw" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-full" onclick="signIn()">Entrar na biblioteca</button>
    </div>

    <div class="aform" id="aform-su">
      <div class="field">
        <label>Nome completo</label>
        <input type="text" id="su-nome" placeholder="O teu nome" autocomplete="name">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="su-email" placeholder="o.teu@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="su-pw" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Confirmar password</label>
        <input type="password" id="su-pw2" placeholder="Repete a password" autocomplete="new-password">
      </div>
      <button class="btn btn-primary btn-full" onclick="signUp()">Criar conta</button>
    </div>
  </div>
</div>

<!-- ══ MAIN ══════════════════════════════════════════════════════════ -->
<div id="main-view">
  <header>
    <div class="logo">
      <span class="logo-mark">📚</span>
      <span class="logo-name">Gestão de <em>Recursos</em></span>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="search-input" placeholder="Pesquisar título, autor ou categoria…" oninput="pesquisar()">
    </div>
    <div class="header-end">
      <div class="user-chip">
        <div class="user-av" id="user-av"></div>
        <span id="user-nm"></span>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="abrirMeusLivros()">Os meus livros</button>
      <button class="btn btn-ghost btn-sm" onclick="abrirHistorico()">Histórico</button>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button>
    </div>
  </header>

  <main>
    <div class="stats">
      <div class="stat navy">
        <div class="stat-n" id="s-total">—</div>
        <div class="stat-l">Total de Livros</div>
      </div>
      <div class="stat green">
        <div class="stat-n" id="s-disp">—</div>
        <div class="stat-l">Disponíveis</div>
      </div>
      <div class="stat orange">
        <div class="stat-n" id="s-req">—</div>
        <div class="stat-l">Requisitados</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="seg">
        <button class="seg-btn active" onclick="setFiltro('todos',this)">Todos</button>
        <button class="seg-btn" onclick="setFiltro('disp',this)">Disponíveis</button>
        <button class="seg-btn" onclick="setFiltro('req',this)">Requisitados</button>
      </div>
      <div class="sp"></div>
      <button class="btn btn-primary" onclick="abrirAdd()">+ Adicionar Livro</button>
    </div>

    <div class="grid" id="grid">
      <div class="empty"><div class="spinner"></div><p>A carregar livros…</p></div>
    </div>

    <div id="admin-box" class="admin-box" style="display:none">
      <div class="admin-title">⚙ Painel de Administração</div>
      <div style="margin-bottom:1rem">
        <button class="btn btn-ghost btn-sm" onclick="recarregarLog()">↺ Actualizar</button>
      </div>
      <div class="log-box" id="admin-log"></div>
    </div>
  </main>
</div>

<!-- Modal: Detalhes -->
<div class="ov" id="ov-det">
  <div class="modal">
    <div class="mhead">
      <h2 id="det-titulo"></h2>
      <button class="mclose" onclick="closeOv('ov-det')">✕</button>
    </div>
    <div id="det-body"></div>
    <div class="mactions" id="det-acts"></div>
  </div>
</div>

<!-- Modal: Adicionar -->
<div class="ov" id="ov-add">
  <div class="modal">
    <div class="mhead">
      <h2>Adicionar Livro</h2>
      <button class="mclose" onclick="closeOv('ov-add')">✕</button>
    </div>
    <div class="field"><label>Título *</label>
      <input type="text" id="add-t" placeholder="Título do livro"></div>
    <div class="field"><label>Autor *</label>
      <input type="text" id="add-a" placeholder="Nome do autor"></div>
    <div class="field">
      <label>Categoria</label>
      <select id="add-c" class="field-select">
        <option value="Geral">Geral</option>
        <option value="Informática">Informática</option>
        <option value="Programação">Programação</option>
        <option value="Redes">Redes</option>
        <option value="Matemática">Matemática</option>
        <option value="Física">Física</option>
        <option value="Química">Química</option>
        <option value="Biologia">Biologia</option>
        <option value="Engenharia">Engenharia</option>
        <option value="Literatura">Literatura</option>
        <option value="História">História</option>
        <option value="Economia">Economia</option>
        <option value="Direito">Direito</option>
        <option value="Medicina">Medicina</option>
        <option value="Outros">Outros</option>
      </select>
    </div>
    <div class="field">
      <label>Ficheiro PDF <span class="field-opt">(opcional)</span></label>
      <input type="file" id="add-pdf" accept=".pdf">
      <div class="file-hint">Máximo 50 MB · apenas .pdf</div>
    </div>
    <div class="factions">
      <button class="btn btn-ghost" onclick="closeOv('ov-add')">Cancelar</button>
      <button class="btn btn-primary" onclick="adicionarLivro()">Adicionar</button>
    </div>
  </div>
</div>

<!-- Modal: Os meus livros -->
<div class="ov" id="ov-meus">
  <div class="modal" style="max-width:600px">
    <div class="mhead">
      <h2>Os meus livros</h2>
      <button class="mclose" onclick="closeOv('ov-meus')">✕</button>
    </div>
    <div id="meus-content">
      <div class="empty"><div class="spinner"></div><p>A carregar…</p></div>
    </div>
  </div>
</div>

<!-- Modal: Histórico -->
<div class="ov" id="ov-hist">
  <div class="modal" style="max-width:640px">
    <div class="mhead">
      <h2>Histórico de Actividade</h2>
      <button class="mclose" onclick="closeOv('ov-hist')">✕</button>
    </div>
    <div class="log-box" id="hist-log" style="max-height:420px"></div>
  </div>
</div>

<!-- Leitor PDF -->
<div class="ov-pdf" id="ov-pdf">
  <div class="pdf-shell">
    <div class="pdf-hd">
      <span class="pdf-hd-title" id="pdf-titulo">—</span>
      <button class="mclose" onclick="closeOv('ov-pdf')">✕</button>
    </div>
    <div class="pdf-nav-bar">
      <button class="btn btn-ghost btn-sm" onclick="pdfPrevPage()">‹ Anterior</button>
      <span class="pdf-pg-info" id="pdf-info">—</span>
      <button class="btn btn-ghost btn-sm" onclick="pdfNextPage()">Próxima ›</button>
    </div>
    <div class="pdf-body" id="pdf-body">
      <div class="pdf-load-msg" id="pdf-loading">
        <div class="spinner"></div>
        A carregar PDF…
      </div>
      <canvas id="pdf-canvas" style="display:none"></canvas>
    </div>
  </div>
</div>

<div id="toasts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
