<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Recursos — Livros</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:          #0f172a;
            --surface:     #1e293b;
            --surface2:    #334155;
            --accent:      #3b82f6;
            --accent-h:    #2563eb;
            --success:     #22c55e;
            --danger:      #ef4444;
            --warning:     #f59e0b;
            --text:        #f1f5f9;
            --text-muted:  #94a3b8;
            --border:      #334155;
            --radius:      12px;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* ── LOGIN ──────────────────────────────────────────────── */
        #login-view {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 1rem;
        }
        .login-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 2.5rem;
            width: 100%; max-width: 400px; text-align: center;
        }
        .login-card h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.4rem; }
        .login-card p  { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }

        /* ── MAIN ───────────────────────────────────────────────── */
        #main-view { display: none; min-height: 100vh; flex-direction: column; }
        #main-view.active { display: flex; }

        header {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 0.875rem 1.5rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
        }
        header h1 { font-size: 1.1rem; font-weight: 700; flex-shrink: 0; }

        .search-wrap { flex: 1; min-width: 180px; max-width: 460px; position: relative; }
        .search-wrap input {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            color: var(--text); padding: 0.5rem 1rem 0.5rem 2.4rem;
            border-radius: 8px; font-size: 0.875rem; outline: none;
        }
        .search-wrap input:focus { border-color: var(--accent); }
        .search-wrap::before {
            content: '🔍'; position: absolute; left: 0.7rem;
            top: 50%; transform: translateY(-50%); font-size: 0.8rem;
        }

        .header-right { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
        .user-badge {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 20px; padding: 0.35rem 0.9rem;
            font-size: 0.8rem; font-weight: 500;
        }

        main { flex: 1; padding: 1.5rem; max-width: 1400px; margin: 0 auto; width: 100%; }

        /* Stats */
        .stats-bar { display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.25rem; text-align: center;
        }
        .stat-card .value { font-size: 2rem; font-weight: 700; line-height: 1; }
        .stat-card .label { color: var(--text-muted); font-size: 0.75rem; margin-top: 0.25rem; text-transform: uppercase; letter-spacing: .05em; }
        .stat-card.s-total .value      { color: var(--accent); }
        .stat-card.s-disponiveis .value { color: var(--success); }
        .stat-card.s-requisitados .value{ color: var(--warning); }

        /* Toolbar */
        .toolbar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
        .filter-tabs { display: flex; gap: 0.2rem; background: var(--surface); border-radius: 8px; padding: 0.2rem; }
        .filter-tab {
            background: transparent; border: none; color: var(--text-muted);
            padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer;
            font-size: 0.825rem; transition: all .15s;
        }
        .filter-tab.active { background: var(--accent); color: #fff; }
        .filter-tab:hover:not(.active) { color: var(--text); background: var(--surface2); }
        .spacer { flex: 1; }

        /* Grid */
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px,1fr)); gap: 1rem; }
        .book-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.25rem;
            cursor: pointer; transition: border-color .15s, transform .15s;
            position: relative; overflow: hidden;
        }
        .book-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .book-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 3px; background: var(--accent); opacity: 0; transition: opacity .15s;
        }
        .book-card:hover::before { opacity: 1; }
        .book-card.requisitado::before { background: var(--warning); opacity: 1; }
        .book-title  { font-size: 0.975rem; font-weight: 600; margin-bottom: 0.2rem; }
        .book-author { color: var(--text-muted); font-size: 0.825rem; margin-bottom: 0.75rem; }
        .book-meta   { display: flex; align-items: center; justify-content: space-between; }

        .badge { display: inline-block; padding: .2rem .6rem; border-radius: 20px; font-size: .72rem; font-weight: 600; }
        .badge-success { background: rgba(34,197,94,.15); color: var(--success); }
        .badge-warning { background: rgba(245,158,11,.15); color: var(--warning); }
        .badge-info    { background: rgba(59,130,246,.15);  color: var(--accent); }

        .empty-state { grid-column: 1/-1; text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
        .empty-state .icon { font-size: 2.5rem; margin-bottom: .75rem; }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; gap: .35rem;
            border: none; border-radius: 8px; padding: .5rem 1rem;
            font-size: .875rem; font-weight: 500; cursor: pointer; transition: all .15s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-h); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { filter: brightness(.9); }
        .btn-danger  { background: var(--danger);  color: #fff; }
        .btn-danger:hover  { filter: brightness(.9); }
        .btn-ghost   { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-ghost:hover   { color: var(--text); background: var(--surface2); }
        .btn-sm { padding: .35rem .7rem; font-size: .8rem; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.65); z-index: 100;
            align-items: center; justify-content: center; padding: 1rem;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 2rem;
            width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
        .modal-header h2 { font-size: 1.15rem; font-weight: 700; }
        .modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: .25rem; }
        .modal-close:hover { color: var(--text); }

        /* Forms */
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .825rem; font-weight: 500; color: var(--text-muted); margin-bottom: .3rem; }
        .form-group input {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            color: var(--text); padding: .6rem .875rem;
            border-radius: 8px; font-size: .9rem; outline: none;
        }
        .form-group input:focus { border-color: var(--accent); }
        .form-actions { display: flex; gap: .75rem; justify-content: flex-end; margin-top: 1.5rem; }

        /* Book details */
        .detail-row  { display: flex; gap: 1rem; margin-bottom: .7rem; align-items: flex-start; }
        .detail-label{ font-size: .75rem; color: var(--text-muted); width: 110px; flex-shrink: 0; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; padding-top: .1rem; }
        .detail-value{ font-size: .9rem; }
        .fila-list { display: flex; flex-direction: column; gap: .25rem; }
        .fila-item { background: var(--bg); border-radius: 6px; padding: .3rem .7rem; font-size: .825rem; }
        .modal-actions { display: flex; gap: .75rem; margin-top: 1.5rem; flex-wrap: wrap; }

        /* Toast */
        #toast-container {
            position: fixed; bottom: 1.5rem; right: 1.5rem;
            display: flex; flex-direction: column; gap: .5rem;
            z-index: 200; pointer-events: none;
        }
        .toast {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; padding: .7rem 1rem; max-width: 320px;
            font-size: .85rem; box-shadow: 0 4px 20px rgba(0,0,0,.4);
            animation: slideIn .2s ease-out; pointer-events: all;
        }
        .toast.success { border-left: 3px solid var(--success); }
        .toast.error   { border-left: 3px solid var(--danger); }
        .toast.info    { border-left: 3px solid var(--accent); }
        @keyframes slideIn { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:translateX(0); } }

        /* Log */
        .log-box {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 8px; padding: 1rem;
            font-family: 'Courier New', monospace; font-size: .75rem;
            color: var(--text-muted); max-height: 320px; overflow-y: auto; white-space: pre;
        }

        /* Admin */
        .admin-panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.5rem; margin-top: 2rem;
        }
        .admin-panel h3 { margin-bottom: 1rem; color: var(--warning); font-size: .95rem; }

        /* Spinner */
        .spinner {
            width: 24px; height: 24px; border: 2px solid var(--border);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin .7s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 560px) {
            main { padding: 1rem; }
            .stats-bar { gap: .5rem; }
            .stat-card { padding: .75rem .5rem; }
            .stat-card .value { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<!-- ═══ LOGIN ═══════════════════════════════════════════════════════ -->
<div id="login-view">
    <div class="login-card">
        <h1>📚 Gestão de Recursos</h1>
        <p>Sistema de partilha de livros entre estudantes</p>
        <div class="form-group">
            <label for="login-nome">O teu nome</label>
            <input type="text" id="login-nome" placeholder="Ex: Maria, João, admin…" autofocus>
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="login()">Entrar</button>
    </div>
</div>

<!-- ═══ MAIN ═════════════════════════════════════════════════════════ -->
<div id="main-view">
    <header>
        <h1>📚 Gestão de Recursos</h1>
        <div class="search-wrap">
            <input type="text" id="search-input" placeholder="Pesquisar livros…" oninput="pesquisar()">
        </div>
        <div class="header-right">
            <span class="user-badge" id="user-badge"></span>
            <button class="btn btn-ghost btn-sm" onclick="abrirHistorico()">Histórico</button>
            <button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button>
        </div>
    </header>

    <main>
        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-card s-total">
                <div class="value" id="stat-total">—</div>
                <div class="label">Total</div>
            </div>
            <div class="stat-card s-disponiveis">
                <div class="value" id="stat-disp">—</div>
                <div class="label">Disponíveis</div>
            </div>
            <div class="stat-card s-requisitados">
                <div class="value" id="stat-req">—</div>
                <div class="label">Requisitados</div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="setFiltro('todos',this)">Todos</button>
                <button class="filter-tab" onclick="setFiltro('disponiveis',this)">Disponíveis</button>
                <button class="filter-tab" onclick="setFiltro('requisitados',this)">Requisitados</button>
            </div>
            <div class="spacer"></div>
            <button class="btn btn-primary" onclick="abrirModalAdicionar()">+ Adicionar Livro</button>
        </div>

        <!-- Grid -->
        <div class="books-grid" id="books-grid">
            <div class="empty-state"><div class="spinner"></div></div>
        </div>

        <!-- Admin -->
        <div id="admin-panel" class="admin-panel" style="display:none;">
            <h3>⚙ Painel de Administração</h3>
            <div style="display:flex;gap:.75rem;margin-bottom:1rem;">
                <button class="btn btn-ghost btn-sm" onclick="carregarLog()">↺ Actualizar log</button>
            </div>
            <div class="log-box" id="log-box"></div>
        </div>
    </main>
</div>

<!-- ═══ MODAL: Adicionar Livro ════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-adicionar">
    <div class="modal">
        <div class="modal-header">
            <h2>Adicionar Livro</h2>
            <button class="modal-close" onclick="fecharModal('modal-adicionar')">✕</button>
        </div>
        <div class="form-group">
            <label>Título *</label>
            <input type="text" id="add-titulo" placeholder="Título do livro">
        </div>
        <div class="form-group">
            <label>Autor *</label>
            <input type="text" id="add-autor" placeholder="Nome do autor">
        </div>
        <div class="form-group">
            <label>Categoria</label>
            <input type="text" id="add-categoria" placeholder="Ex: Programação, Matemática…">
        </div>
        <div class="form-actions">
            <button class="btn btn-ghost" onclick="fecharModal('modal-adicionar')">Cancelar</button>
            <button class="btn btn-primary" onclick="adicionarLivro()">Adicionar</button>
        </div>
    </div>
</div>

<!-- ═══ MODAL: Detalhes do Livro ══════════════════════════════════════ -->
<div class="modal-overlay" id="modal-detalhes">
    <div class="modal">
        <div class="modal-header">
            <h2 id="detalhe-titulo">Detalhes</h2>
            <button class="modal-close" onclick="fecharModal('modal-detalhes')">✕</button>
        </div>
        <div id="detalhe-conteudo"></div>
        <div class="modal-actions" id="detalhe-acoes"></div>
    </div>
</div>

<!-- ═══ MODAL: Histórico ══════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-historico">
    <div class="modal" style="max-width:660px;">
        <div class="modal-header">
            <h2>Histórico de Actividade</h2>
            <button class="modal-close" onclick="fecharModal('modal-historico')">✕</button>
        </div>
        <div class="log-box" id="historico-box"></div>
    </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
